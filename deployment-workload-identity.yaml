apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-canary-workload-identity
  annotations:
    azure.workload.identity/client-id: "<entra-identity-client-id>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-canary-workload-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-canary-workload-identity
  template:
    metadata:
      labels:
        app: kafka-canary-workload-identity
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kafka-canary-workload-identity
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: certs
          projected:
            sources:
              - secret:
                  name: kafka-cluster-ca-cert
                  items:
                    - key: ca.crt
                      path: ca.crt
      containers:
        - name: kafka-canary
          image: registry.example.com/kafka-canary:workload-identity
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA__GROUPID
              value: "kafka-canary-workload-identity-group-$(POD_NAME)"
            - name: KAFKA__SASLMECHANISM
              value: "OAuthBearer"
            - name: KAFKA__USEWORKLOADIDENTITY
              value: "true"
            - name: KAFKA__OAUTHSCOPE
              value: "api://<kafka-api-app-id>/.default"
            - name: KAFKA__BOOTSTRAPSERVERS
              value: "kafka:443"
            - name: KAFKA__TOPIC
              value: "onprem.test.canary-data.add.v1"
            - name: KAFKA__SSLCALOCATION
              value: "/kafka-ca/ca.crt"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Optional: export traces to an OpenTelemetry collector.
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector:4317"
          readinessProbe:
            httpGet:
              port: 8080
              path: /health/ready
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: certs
              mountPath: /kafka-ca
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-canary-workload-identity
  labels:
    app: kafka-canary-workload-identity
spec:
  selector:
    app: kafka-canary-workload-identity
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
