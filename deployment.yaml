apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-canary
  template:
    metadata:
      labels:
        app: kafka-canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: kafka-canary
          image: docker.io/sebgot/kafka-canary:0.0.7
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA__GROUPID
              value: "kafka-canary-group-$(POD_NAME)"
            - name: KAFKA__SASLMECHANISM
              value: "OAuthBearer"
            - name: KAFKA__CLIENTID
              valueFrom:
                secretKeyRef:
                  name: dummy-app-details
                  key: clientId
            - name: KAFKA__CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: dummy-app-details
                  key: clientSecret
            - name: KAFKA__TOKENENDPOINT
              value: "https://login.microsoftonline.com/a0662e96-1770-4f05-82d5-6a513fa8b7be/oauth2/v2.0/token"
            - name: KAFKA__OAUTHSCOPE
              value: "api://56a6af18-83dc-4f3f-9c30-f367f42f7aaa/.default"
            - name: KAFKA__BOOTSTRAPSERVERS
              value: "kafka:443"
            - name: KAFKA__TOPIC
              value: "onprem.test.canary-data.add.v1"
            - name: DOTNET_RUNNING_IN_CONTAINER
              value: "true"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Optional: export traces to an OpenTelemetry collector.
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: "http://otel-collector:4317"
          readinessProbe:
            httpGet:
              port: 8080
              path: /health/ready
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-canary
  labels:
    app: kafka-canary
spec:
  selector:
    app: kafka-canary
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
